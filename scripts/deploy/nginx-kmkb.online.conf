# Salin ke /etc/nginx/sites-available/kmkb.online lalu:
# ln -sf /etc/nginx/sites-available/kmkb.online /etc/nginx/sites-enabled/
# nginx -t && systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name kmkb.online www.kmkb.online;

    server_tokens off;
    client_max_body_size 25M;

    root /www/wwwroot/kmkb/public;
    index index.php;

    access_log /var/log/nginx/kmkb.access.log;
    error_log  /var/log/nginx/kmkb.error.log;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location ~ /\.(?!well-known).* { deny all; }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~* \.(?:css|js|jpg|jpeg|png|gif|svg|ico|webp|ttf|otf|woff|woff2)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
